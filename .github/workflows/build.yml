name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/kotha/app
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'kotha-android'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.kotha.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.kotha.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Kotha"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/kotha/app/MainActivity.java <<'EOF'
          package com.kotha.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.InputType;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              private WebView web;
              private PermissionRequest pendingReq;
              private GeolocationPermissions.Callback geoCb;
              private String geoOrigin;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setGeolocationEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest r) {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  pendingReq = r;
                                  ArrayList<String> need = new ArrayList<String>();
                                  for (String res : r.getResources()) {
                                      if (res.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE)
                                          && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                                          need.add(Manifest.permission.RECORD_AUDIO);
                                      if (res.equals(PermissionRequest.RESOURCE_VIDEO_CAPTURE)
                                          && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED)
                                          need.add(Manifest.permission.CAMERA);
                                  }
                                  if (need.isEmpty()) {
                                      r.grant(r.getResources());
                                      pendingReq = null;
                                  } else {
                                      requestPermissions(need.toArray(new String[0]), 1);
                                  }
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              cb.invoke(origin, true, false);
                          } else {
                              geoCb = cb;
                              geoOrigin = origin;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 2);
                          }
                      }
                  });
                  if (Build.VERSION.SDK_INT >= 33
                      && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 3);
                  }
                  showNotification();
                  loadSaved();
              }

              private void loadSaved() {
                  SharedPreferences p = getSharedPreferences("kotha", MODE_PRIVATE);
                  String url = p.getString("url", "");
                  if (url.isEmpty()) askUrl(); else web.loadUrl(url);
              }

              private void askUrl() {
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_TEXT_VARIATION_URI);
                  et.setHint("https://...run.app");
                  new AlertDialog.Builder(this)
                      .setTitle("Kotha link")
                      .setView(et)
                      .setCancelable(false)
                      .setPositiveButton("Open", new android.content.DialogInterface.OnClickListener() {
                          public void onClick(android.content.DialogInterface d, int w) {
                              String u = et.getText().toString().trim();
                              if (u.isEmpty()) { askUrl(); return; }
                              if (!u.startsWith("http")) u = "https://" + u;
                              getSharedPreferences("kotha", MODE_PRIVATE).edit().putString("url", u).apply();
                              web.loadUrl(u);
                          }
                      })
                      .show();
              }

              private void showNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel("kotha_talk", "Kotha", NotificationManager.IMPORTANCE_LOW));
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(this, 1, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Intent change = new Intent(this, MainActivity.class);
                  change.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                  change.putExtra("change", true);
                  PendingIntent pi2 = PendingIntent.getActivity(this, 2, change, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Action act = new Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_edit), "Change link", pi2).build();
                  Notification n = new Notification.Builder(this, "kotha_talk")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Kotha")
                      .setContentText("Tap to talk")
                      .setOngoing(true)
                      .setContentIntent(pi)
                      .addAction(act)
                      .build();
                  nm.notify(1, n);
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  if (i.getBooleanExtra("change", false)) askUrl();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  boolean ok = res.length > 0;
                  for (int x : res) if (x != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (code == 1 && pendingReq != null) {
                      if (ok) pendingReq.grant(pendingReq.getResources()); else pendingReq.deny();
                      pendingReq = null;
                  } else if (code == 2 && geoCb != null) {
                      geoCb.invoke(geoOrigin, ok, false);
                      geoCb = null;
                  } else if (code == 3) {
                      showNotification();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kotha-APK
          path: app/build/outputs/apk/debug/app-debug.apk
